name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write
  packages: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push core image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./core/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/rugol-core:${{ github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/rugol-core:latest

      - name: Build and push dashboard image
        uses: docker/build-push-action@v6
        with:
          context: ./dashboard
          file: ./dashboard/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/rugol-dashboard:${{ github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/rugol-dashboard:latest

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            installer/install.bat
            installer/wizard.ps1
            docker-compose.yml
          generate_release_notes: true
