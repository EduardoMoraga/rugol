# Default profile — single host, SQLite, no Redis. Perfect for personal PC.
# For prod, see docker-compose.prod.yml.

services:
  core:
    build:
      context: .
      dockerfile: ./core/Dockerfile
    container_name: rugol-core
    # Defaults keep `docker compose up` in a clone working unchanged.
    # The `rugol` CLI exports these to point at ~/.rugol (global home),
    # so state survives updates and reclones.
    env_file: ${RUGOL_ENV_FILE:-.env}
    volumes:
      - ${RUGOL_AGENTS:-./agents}:/app/agents
      - ${RUGOL_SKILLS:-./skills}:/app/skills
      - ${RUGOL_DATA:-./data}:/app/data
      - ${RUGOL_LOGS:-./logs}:/app/logs
    ports:
      - "${CORE_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    container_name: rugol-dashboard
    environment:
      - NEXT_PUBLIC_API_URL=http://core:8000
      - NODE_ENV=production
    depends_on:
      core:
        condition: service_healthy
    ports:
      - "${DASHBOARD_PORT:-3000}:3000"
    restart: unless-stopped
