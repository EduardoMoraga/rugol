# Default profile — single host, SQLite, no Redis. Perfect for personal PC.
# For prod, see docker-compose.prod.yml.

services:
  core:
    build:
      context: .
      dockerfile: ./core/Dockerfile
    container_name: rogologo-core
    env_file: .env
    volumes:
      - ./agents:/app/agents
      - ./skills:/app/skills
      - ./data:/app/data
      - ./logs:/app/logs
    ports:
      - "${CORE_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    container_name: rogologo-dashboard
    environment:
      - NEXT_PUBLIC_API_URL=http://core:8000
      - NODE_ENV=production
    depends_on:
      core:
        condition: service_healthy
    ports:
      - "${DASHBOARD_PORT:-3000}:3000"
    restart: unless-stopped
